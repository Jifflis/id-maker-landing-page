name: Deploy Landing Page to VPS Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

          set -e

          APP_DIR="/var/www/id-makers"
          BRANCH="main"

          echo "--- Moving to landing page directory ---"
          cd "$APP_DIR"

          echo "--- Pulling latest code ---"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          echo "--- Installing dependencies ---"
          npm ci

          echo "--- Building Next.js application ---"
          npm run build

          echo "--- Restarting landing page service ---"
          systemctl restart id-makers

          echo "--- Checking service ---"
          systemctl is-active --quiet id-makers

          echo "--- Testing local Next.js server ---"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://127.0.0.1:3000/)

          echo "Local landing page returned HTTP $HTTP_CODE"

          echo "--- Testing production website ---"
          HTTPS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://id-makers.com/)

          echo "Production website returned HTTP $HTTPS_CODE"

          if [ "$HTTPS_CODE" != "200" ]; then
            echo "❌ Production health check failed"
            exit 1
          fi

          echo "✅ Landing page deployment completed successfully!"
          EOF