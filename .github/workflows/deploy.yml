name: Deploy Landing Page to VPS Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          NEXT_PUBLIC_LOGGER_API_KEY: ${{ secrets.NEXT_PUBLIC_LOGGER_API_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_LOGGER_API_KEY" ]; then
            echo "NEXT_PUBLIC_LOGGER_API_KEY secret is not configured"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "NEXT_PUBLIC_LOGGER_API_KEY='$NEXT_PUBLIC_LOGGER_API_KEY' bash -se" << 'EOF'

          set -e

          APP_DIR="/var/www/id-makers"
          BRANCH="main"
          SERVICE_NAME="id-makers"
          APP_PORT="3000"

          echo "--- Moving to landing page directory ---"
          cd "$APP_DIR"

          echo "--- Pulling latest code ---"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          echo "--- Installing dependencies ---"
          npm ci

          echo "--- Building Next.js application ---"
          export NEXT_PUBLIC_LOGGER_URL="https://api.app-logger.com"
          npm run build

          echo "--- Restarting landing page service ---"
          systemctl restart "$SERVICE_NAME"

          echo "--- Checking service ---"
          systemctl is-active --quiet "$SERVICE_NAME"

          echo "--- Testing local Next.js server ---"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 \
              "http://127.0.0.1:${APP_PORT}/" >/dev/null; then
              echo "Local landing page is ready"
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "❌ Local landing page health check failed"
              systemctl status "$SERVICE_NAME" --no-pager || true
              journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true
              exit 1
            fi

            echo "Waiting for local server (attempt $attempt/12)..."
            sleep 5
          done

          echo "--- Testing production website ---"
          curl --fail --silent --show-error --location --retry 5 \
            --retry-delay 3 https://id-makers.com/ >/dev/null

          echo "✅ Landing page deployment completed successfully!"
          EOF
